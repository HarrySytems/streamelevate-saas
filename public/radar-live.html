<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamElevate • Radar Live Graph Test</title>
  <style>
    :root {
      --bg: #070b10;
      --card-bg: #0d131b;
      --accent-neon: #53fc18;
      --twitch-purple: #a970ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    /* Top Bar */
    .topbar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      color: #f8fafc;
    }
    .brand-icon {
      background: #e11d48;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .select-streamer {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: #334155;
    }
    .btn.active {
      background: var(--accent-neon);
      color: #000000;
      border-color: var(--accent-neon);
      font-weight: 800;
    }
    .btn-twitch.active {
      background: var(--twitch-purple) !important;
      color: #ffffff !important;
      border-color: var(--twitch-purple) !important;
    }
    .btn-replay {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-replay:hover {
      background: #0369a1;
    }
    .btn-replay.active {
      background: #38bdf8 !important;
      color: #000000 !important;
      border-color: #38bdf8 !important;
      font-weight: 800;
    }

    /* Full Canvas Container */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
    }
    .canvas-card {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #090f15;
      border: 1px solid #1a2634;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Status Pill */
    .status-pill {
      position: absolute;
      bottom: 14px;
      left: 20px;
      background: rgba(13, 19, 27, 0.90);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- Top Bar Controls -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>RadarStream • Test de Gráfica Ecualizador</span>
    </div>

    <div class="controls">
      <select id="streamerSelect" class="select-streamer" onchange="onSelectStreamer(this.value)">
        <option value="">Cargando canales...</option>
      </select>

      <button id="btnLiveMode" class="btn active" onclick="setMode('live')">
        🔴 Modo En Vivo (3s)
      </button>

      <button id="btnReplayMode" class="btn btn-replay" onclick="startReplay()">
        ⚡ Simular Reproducción Ecualizador
      </button>

      <button id="btnBarsToggle" class="btn" onclick="toggleEqualizerBars()">
        🎛️ Barras de Espectro: ON
      </button>

      <a href="/live-counter.html" class="btn">
        📊 Ver Modo Contador
      </a>
    </div>
  </header>

  <!-- Main Pure Graph Viewport -->
  <main class="viewport">
    <div class="canvas-card">
      <canvas id="radarCanvas" width="1280" height="720"></canvas>
      <div class="status-pill">
        <span id="liveDot" class="dot"></span>
        <span id="statusText">Conectando a telemetría en vivo...</span>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // MOTOR MATEMÁTICO PCHIP (Interpolación Suave de Alta Precisión)
    // ==========================================
    function cleanSamples(raw) {
      const seen = new Set();
      let cleaned = (raw || [])
        .map(s => ({ t: Number(s.timestamp ?? s.t), v: Number(s.viewers ?? s.v) }))
        .filter(s => Number.isFinite(s.t) && Number.isFinite(s.v) && s.v >= 0)
        .sort((a, b) => a.t - b.t)
        .filter(s => {
          if (seen.has(s.t)) return false;
          seen.add(s.t);
          return true;
        });

      if (cleaned.length < 2) {
        const now = Date.now();
        if (cleaned.length === 1) return [{ t: cleaned[0].t - 30000, v: cleaned[0].v }, cleaned[0]];
        return [{ t: now - 30000, v: 0 }, { t: now, v: 0 }];
      }

      // Mantener la curva 'de frente' al final (sin ganchos ni caídas al apagar):
      if (cleaned.length >= 6) {
        const last = cleaned[cleaned.length - 1];
        let stableIdx = cleaned.length - 1;
        for (let i = cleaned.length - 2; i >= Math.max(0, cleaned.length - 8); i--) {
          const dt = (last.t - cleaned[i].t) / 1000;
          if (dt <= 300) {
            const dropRatio = (cleaned[i].v - last.v) / (cleaned[i].v || 1);
            if (dropRatio > 0.12) {
              stableIdx = i;
            }
          }
        }
        if (stableIdx < cleaned.length - 1) {
          const stableV = cleaned[stableIdx].v;
          const endT = last.t;
          cleaned = cleaned.slice(0, stableIdx + 1);
          cleaned.push({ t: endT, v: stableV });
        }
      }

      // Suavizado orgánico contra escalones rígidos por caché CDN de Twitch
      if (cleaned.length >= 4) {
        const smoothed = cleaned.map(p => ({ t: p.t, v: p.v }));
        for (let i = 1; i < smoothed.length - 1; i++) {
          smoothed[i].v = 0.2 * cleaned[i - 1].v + 0.6 * cleaned[i].v + 0.2 * cleaned[i + 1].v;
        }
        cleaned = smoothed;
      }
      return cleaned;
    }

    function computePchipSlopes(xs, ys) {
      const n = xs.length;
      const h = new Array(n - 1);
      const delta = new Array(n - 1);
      for (let i = 0; i < n - 1; i++) {
        h[i] = xs[i + 1] - xs[i];
        delta[i] = (ys[i + 1] - ys[i]) / (h[i] || 1);
      }
      const m = new Array(n);
      if (n === 2) {
        m[0] = m[1] = delta[0];
        return m;
      }
      for (let i = 1; i < n - 1; i++) {
        const d0 = delta[i - 1], d1 = delta[i];
        if (d0 === 0 || d1 === 0 || (d0 > 0) !== (d1 > 0)) {
          m[i] = 0;
        } else {
          const w0 = 2 * h[i] + h[i - 1];
          const w1 = h[i] + 2 * h[i - 1];
          m[i] = (w0 + w1) / (w0 / d0 + w1 / d1);
        }
      }
      m[0] = ((2 * h[0] + h[1]) * delta[0] - h[0] * delta[1]) / (h[0] + h[1] || 1);
      if (delta[0] === 0 || (m[0] > 0) !== (delta[0] > 0)) m[0] = 0;
      m[n - 1] = ((2 * h[n - 2] + h[n - 3]) * delta[n - 2] - h[n - 2] * delta[n - 3]) / (h[n - 2] + h[n - 3] || 1);
      if (delta[n - 2] === 0 || (m[n - 1] > 0) !== (delta[n - 2] > 0)) m[n - 1] = 0;
      return m;
    }

    function hermite(x0, x1, y0, y1, m0, m1, x) {
      const h = x1 - x0;
      if (h <= 0) return y0;
      const t = (x - x0) / h;
      const t2 = t * t, t3 = t2 * t;
      return (2*t3 - 3*t2 + 1)*y0 + (t3 - 2*t2 + t)*h*m0 + (-2*t3 + 3*t2)*y1 + (t3 - t2)*h*m1;
    }

    function createPchipInterpolator(samples) {
      const s = cleanSamples(samples);
      const xs = s.map(p => p.t);
      const ys = s.map(p => p.v);
      const slopes = computePchipSlopes(xs, ys);
      return function(t) {
        if (t <= xs[0]) return ys[0];
        if (t >= xs[xs.length - 1]) return ys[ys.length - 1];
        let lo = 0, hi = xs.length - 1;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (xs[mid] <= t) lo = mid; else hi = mid;
        }
        return Math.max(0, hermite(xs[lo], xs[hi], ys[lo], ys[hi], slopes[lo], slopes[hi], t));
      };
    }

    // ==========================================
    // ESTADO DEL RENDERIZADO
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const paramStreamer = urlParams.get('streamer') || urlParams.get('channel');
    let hasCustomParam = false;

    const exportMode = window.__RADAR_EXPORT__ === true;
    let exportTimeMs = 0;
    let currentSlug = 'westcol';
    let currentPlatform = 'kick';

    if (paramStreamer) {
      hasCustomParam = true;
      if (paramStreamer.includes(':')) {
        const [p, s] = paramStreamer.split(':');
        currentPlatform = p.toLowerCase();
        currentSlug = s.toLowerCase();
      } else {
        currentSlug = paramStreamer.toLowerCase();
      }
    }

    let currentStreamerData = null;
    let currentSamples = [];
    let densePoints = [];

    let streamerAvatarImg = null;
    let currentAvatarUrl = '';

    let currentMode = 'live'; // 'live' | 'replay'
    let showEqualizerBars = true;
    let replayProgress = 1;
    let replayAnimId = null;

    let targetViewerCount = 0;
    let displayedViewerCount = 0;
    let lastSyncTime = Date.now();
    let currentInterpolator = null;

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    // Margins clásicos calibrados del diseño Westcol
    const LIVE_MARGIN = {
      left: 100,
      right: 60,
      top: 130,
      bottom: 640
    };

    function updateButtonTheme() {
      const isTwitch = (currentPlatform === 'twitch');
      const liveBtn = document.getElementById('btnLiveMode');
      if (liveBtn) {
        liveBtn.classList.toggle('btn-twitch', isTwitch);
      }
      const neon = isTwitch ? '#a970ff' : '#53fc18';
      const liveDot = document.getElementById('liveDot');
      if (liveDot && currentMode === 'live') {
        liveDot.style.background = neon;
        liveDot.style.boxShadow = `0 0 10px ${neon}`;
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnLiveMode').classList.toggle('active', mode === 'live');
      document.getElementById('btnReplayMode').classList.toggle('active', mode === 'replay');
      if (mode === 'live') {
        if (replayAnimId) cancelAnimationFrame(replayAnimId);
        replayProgress = 1;
        updateButtonTheme();
        updateStatusText();
      }
    }

    function toggleEqualizerBars() {
      showEqualizerBars = !showEqualizerBars;
      document.getElementById('btnBarsToggle').textContent = `🎛️ Barras de Espectro: ${showEqualizerBars ? 'ON' : 'OFF'}`;
    }

    async function startReplay() {
      // Cargar resumen final antes de reproducir para fijar media desde el principio
      if (!currentStreamerData?.stream_id) return;
      const replaySessionId = currentStreamerData.stream_id;
      {
        try {
          const slug = currentStreamerData.slug || currentSlug;
          const sessRes = await fetch(`/api/v1/streamers/${encodeURIComponent(slug)}/session/${encodeURIComponent(replaySessionId)}`);
          if (!sessRes.ok) throw new Error('No se pudo cargar el resumen');
          const sessData = await sessRes.json();
          if (currentStreamerData?.stream_id !== replaySessionId) return;
          if (!sessData.stream || sessData.stream.status !== 'ended') {
            throw new Error('La media final estará disponible al terminar la emisión');
          }
          const avg = sessData.stream.avg_viewers;
          if (avg !== null && (typeof avg !== 'number' || !Number.isFinite(avg))) {
            throw new Error('La media final recibida no es válida');
          }
          currentStreamerData.avg_viewers = avg;
        } catch (e) {
          document.getElementById('statusText').textContent = e.message;
          return;
        }
      }

      setMode('replay');
      replayProgress = 0;
      const durationMs = 12000; // 12 segundos de reproducción continua
      const startTime = performance.now();

      function step(now) {
        if (currentMode !== 'replay') return;
        const elapsed = now - startTime;
        replayProgress = Math.min(1, elapsed / durationMs);

        const pct = Math.round(replayProgress * 100);
        document.getElementById('statusText').textContent = `⚡ Reproduciendo evolución temporal: ${pct}% • Viendo cómo sube y baja la audiencia`;
        document.getElementById('liveDot').style.background = '#38bdf8';
        document.getElementById('liveDot').style.boxShadow = '0 0 10px #38bdf8';

        if (replayProgress < 1) {
          replayAnimId = requestAnimationFrame(step);
        } else {
          document.getElementById('statusText').textContent = `✅ Simulación completada (100%). Haz clic en '🔴 Modo En Vivo' para telemetría en tiempo real.`;
        }
      }

      if (replayAnimId) cancelAnimationFrame(replayAnimId);
      replayAnimId = requestAnimationFrame(step);
    }

    function updateStatusText() {
      if (currentMode === 'replay') return;
      const secSinceSync = Math.max(0, Math.floor((Date.now() - lastSyncTime) / 1000));
      const vCount = Math.round(displayedViewerCount || currentStreamerData?.current_viewers || 0);
      document.getElementById('statusText').textContent = 
        `🟢 TELEMETRÍA EN DIRECTO • ${currentSlug.toUpperCase()} (${currentPlatform.toUpperCase()}) • ${vCount.toLocaleString()} VIEWERS • Sincronizado hace ${secSinceSync}s • ${currentSamples.length} muestras`;
    }

    // ==========================================
    // DIBUJADO DE LA GRÁFICA PURA (DISEÑO ORIGINAL WESTCOL)
    // ==========================================
    function draw() {
      if (!exportMode) requestAnimationFrame(draw);

      // Evitar que el estado de texto del fotograma anterior desplace la cabecera.
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.shadowBlur = 0;
      const W = canvas.width;
      const H = canvas.height;
      const reportLayout = exportMode;
      const MARGIN = reportLayout ? { left: 90, right: 390, top: 150, bottom: 470 } : LIVE_MARGIN;
      const isKick = (currentPlatform === 'kick');
      const neon = isKick ? '#53fc18' : '#a970ff';
      const areaColor = isKick ? 'rgba(83, 252, 24, 0.35)' : 'rgba(169, 112, 255, 0.35)';

      // 1. Fondo Broadcast Oscuro Clásico
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#090f15');
      bg.addColorStop(1, '#05080c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      if (reportLayout) {
        ctx.fillStyle = '#101820'; ctx.fillRect(35, 120, 885, 405);
        ctx.strokeStyle = '#24313c'; ctx.lineWidth = 1; ctx.strokeRect(35.5, 120.5, 885, 405);
      }
      // 2. Líneas de Cuadrícula Sutiles (Estilo broadcast)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 1;
      for (let x = MARGIN.left; x <= W - MARGIN.right; x += reportLayout ? (W - MARGIN.right - MARGIN.left) / 18 : 55) {
        ctx.beginPath();
        ctx.moveTo(x, MARGIN.top);
        ctx.lineTo(x, MARGIN.bottom);
        ctx.stroke();
      }

      // 3. Marca de Agua Gigante (KICK o TWITCH)
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.font = '900 160px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentPlatform.toUpperCase(), (MARGIN.left + (W - MARGIN.right)) / 2, (MARGIN.top + MARGIN.bottom) / 2);
      ctx.restore();

      // 4. Barra Neón Superior
      const accent = ctx.createLinearGradient(0, 0, W, 0);
      accent.addColorStop(0, 'transparent');
      accent.addColorStop(0.2, neon);
      accent.addColorStop(0.5, '#ffffff');
      accent.addColorStop(0.8, neon);
      accent.addColorStop(1, 'transparent');
      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, W, 3);

      // 5. Header del Streamer (Arriba)
      const streamerName = (currentStreamerData?.slug || currentSlug).toUpperCase();
      const title = currentStreamerData?.title || 'Emisión en Directo';
      const category = currentStreamerData?.category || 'General';
      const isLive = Boolean(currentStreamerData?.is_live);

      // Avatar con foto real o fallback estilizado
      const avX = 65, avY = 60, avR = 30;
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(avX, avY, avR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(avX, avY, avR - 1, 0, Math.PI * 2);
      ctx.clip();
      if (streamerAvatarImg && streamerAvatarImg.complete && streamerAvatarImg.naturalWidth > 0) {
        ctx.drawImage(streamerAvatarImg, avX - avR, avY - avR, avR * 2, avR * 2);
      } else {
        ctx.fillStyle = '#14202c';
        ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
        ctx.fillStyle = neon;
        ctx.font = '900 30px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(streamerName[0] || '?', avX, avY + 2);
      }
      ctx.restore();

      // Badge de plataforma sobre el avatar
      ctx.save();
      ctx.fillStyle = neon;
      ctx.beginPath();
      ctx.arc(avX + 22, avY + 22, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.font = '900 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isKick ? 'K' : 'T', avX + 22, avY + 23);
      ctx.restore();

      // Textos de Cabecera
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 28px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(streamerName, 115, 52);

      // Badge LIVE
      ctx.fillStyle = isLive ? '#ef4444' : '#475569';
      ctx.beginPath();
      ctx.roundRect(115, 64, isLive ? 68 : 78, 20, 4);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 11px Arial';
      ctx.fillText(isLive ? '🔴 EN VIVO' : (exportMode ? 'RESUMEN' : 'OFFLINE'), 123, 78);

      // Título y Categoría
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 14px Arial';
      let titleDisplay = `TÍTULO: ${title} • [${category}]`;
      if (ctx.measureText(titleDisplay).width > 700) {
        while (titleDisplay.length > 5 && ctx.measureText(titleDisplay).width > 680) {
          titleDisplay = titleDisplay.slice(0, -3);
        }
        titleDisplay += '…';
      }
      ctx.fillText(titleDisplay, 200, 78);
      if (reportLayout) {
        ctx.font = '11px Consolas, monospace';
        const d = currentStreamerData;
        const duration = Math.max(0, d.duration_seconds ?? (d.ended_at - d.started_at) / 1000);
        ctx.fillText(`${category.toUpperCase()} • INICIO: ${new Date(d.started_at).toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'})} • DURACIÓN: ${Math.floor(duration/3600)}H ${Math.floor(duration%3600/60)}M`, 115, 101);
      }

      // Marca RADARSTREAM (Derecha Arriba)
      ctx.fillStyle = neon;
      ctx.font = '900 22px Arial';
      ctx.textAlign = 'right';
      ctx.fillText('RADARSTREAM', W - 60, 52);
      ctx.fillStyle = '#64748b';
      ctx.font = '700 11px Arial';
      ctx.fillText(exportMode ? 'RESUMEN DE EMISIÓN • HD VIEW' : 'LIVE TELEMETRY ENGINE • HD VIEW', W - 60, 70);

      // 6. Preparar Escala de Datos de la Gráfica
      if (densePoints.length < 2) return;

      const firstT = densePoints[0].t;
      const lastT = densePoints[densePoints.length - 1].t;
      const timeSpan = Math.max(1, lastT - firstT);

      // Buscar pico máximo para escalar eje Y dinámico
      let maxV = -Infinity;
      densePoints.forEach(p => { if (p.v > maxV) maxV = p.v; });
      maxV = Math.max(100, Math.max(maxV, targetViewerCount));
      const stepRound = maxV > 50000 ? 10000 : (maxV > 20000 ? 5000 : (maxV > 5000 ? 1000 : 500));
      const yCeil = Math.ceil((maxV * 1.15) / stepRound) * stepRound;

      const graphW = (W - MARGIN.right) - MARGIN.left;
      const graphH = MARGIN.bottom - MARGIN.top;

      const getX = (t) => MARGIN.left + ((t - firstT) / timeSpan) * graphW;
      const getY = (v) => MARGIN.bottom - (Math.max(0, v) / yCeil) * graphH;

      // 7. Eje Y y Guías Horizontales
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = reportLayout ? '9px Consolas, monospace' : '600 12px Arial';
      ctx.fillStyle = '#64748b';
      const ySteps = reportLayout ? 11 : 5;
      for (let i = 0; i <= ySteps; i++) {
        const val = Math.round((yCeil / ySteps) * i);
        const yPos = MARGIN.bottom - (i / ySteps) * graphH;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.beginPath();
        ctx.moveTo(MARGIN.left, yPos);
        ctx.lineTo(W - MARGIN.right, yPos);
        ctx.stroke();

        ctx.fillText(val.toLocaleString(), MARGIN.left - 12, yPos);
      }

      // 8. Eje X (Horarios)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#64748b';
      ctx.font = reportLayout ? '9px Consolas, monospace' : '600 12px Arial';
      const xSteps = reportLayout ? 18 : 6;
      for (let i = 0; i <= xSteps; i++) {
        const tVal = firstT + (timeSpan / xSteps) * i;
        const xPos = MARGIN.left + (i / xSteps) * graphW;
        const timeStr = new Date(tVal).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        if (reportLayout) {
          ctx.save(); ctx.translate(xPos, MARGIN.bottom + 12); ctx.rotate(-Math.PI / 4);
          ctx.textAlign = 'right'; ctx.fillText(timeStr, 0, 0); ctx.restore();
        } else ctx.fillText(timeStr, xPos, MARGIN.bottom + 10);
      }

      // 9. Filtrar puntos visibles según el modo (Live o Replay) - 100% DATOS REALES
      const progress = currentMode === 'replay' ? Math.max(0, Math.min(1, replayProgress)) : 1;
      const headTime = progress === 1 ? lastT : firstT + progress * (lastT - firstT);
      const visiblePoints = densePoints.filter(p => p.t < headTime);
      visiblePoints.push({ t: headTime, v: currentInterpolator ? currentInterpolator(headTime) : targetViewerCount });

      // Suavizado orgánico del número del cabezal en vivo a 60fps conectado al bot
      if (currentMode === 'live' && targetViewerCount > 0) {
        displayedViewerCount += (targetViewerCount - displayedViewerCount) * 0.08;
      }
      const head = visiblePoints[visiblePoints.length - 1];
      const hX = getX(head.t);
      const hV = (currentMode === 'live' && targetViewerCount > 0) ? displayedViewerCount : head.v;
      const hY = getY(hV);

      // Función reactiva viva del cabezal: conecta matemáticamente la curva y los hilos al bot
      function getLiveCurveValue(t) {
        const pchipVal = currentInterpolator ? currentInterpolator(t) : hV;
        if (currentMode !== 'live' || targetViewerCount <= 0 || !displayedViewerCount) {
          return pchipVal;
        }
        // Ventana viva del cabezal: últimos 40-75s o 10% del gráfico para transición suave
        const leadWindow = Math.min(75000, Math.max(15000, timeSpan * 0.10));
        const tLead = lastT - leadWindow;
        if (t <= tLead) return pchipVal;

        const u = Math.max(0, Math.min(1, (t - tLead) / leadWindow));
        const s = u * u * (3 - 2 * u); // Smoothstep Hermite
        return (1 - s) * pchipVal + s * displayedViewerCount;
      }

      // ========================================== 
      // 10. RESPLANDOR AMBIENTAL TRANSLÚCIDO BAJO LA CURVA (SUTIL Y ELEGANTE)
      // ========================================== 
      const areaGrad = ctx.createLinearGradient(0, MARGIN.top, 0, MARGIN.bottom);
      areaGrad.addColorStop(0, isKick ? 'rgba(83, 252, 24, 0.04)' : 'rgba(169, 112, 255, 0.04)');
      areaGrad.addColorStop(0.70, isKick ? 'rgba(83, 252, 24, 0.01)' : 'rgba(169, 112, 255, 0.01)');
      areaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = areaGrad;
      ctx.beginPath();
      ctx.moveTo(getX(visiblePoints[0].t), MARGIN.bottom);
      visiblePoints.forEach((p, idx) => {
        const isLast = (idx === visiblePoints.length - 1);
        const px = isLast ? hX : getX(p.t);
        const py = isLast ? hY : getY(getLiveCurveValue(p.t));
        ctx.lineTo(px, py);
      });
      ctx.lineTo(hX, MARGIN.bottom);
      ctx.closePath();
      ctx.fill();

      // ========================================== 
      // 11. ECUALIZADOR TÍTERE DE HILOS: COLUMNA VERTEBRAL
      // (Hilos finos translúcidos individuales que nacen en el suelo y mueren EXACTAMENTE en la curva)
      // ========================================== 
      let barsDrawn = 0;
      if (showEqualizerBars) {
        // En exportación 6.5px garantiza >100 barras en 800px; en vivo 6.0px da alta definición con respiración
        const threadStep = exportMode ? 6.5 : 6.0;
        const threadWidth = 0.9;
        const maxBarX = Math.min(hX - 0.5, (W - MARGIN.right) - 0.5);

        for (let bx = MARGIN.left; bx <= maxBarX; bx += threadStep) {
          const normX = Math.max(0, Math.min(1, (bx - MARGIN.left) / graphW));
          const targetT = firstT + normX * timeSpan;
          const pVal = getLiveCurveValue(targetT);
          // La altura del hilo es 100% matemática sobre la curva (columna vertebral)
          const baseY = getY(pVal);

          const maxAvail = Math.max(0, MARGIN.bottom - baseY);
          if (maxAvail <= 1.5) continue;

          // Gradiente translúcido estilo foto de referencia (fino y etéreo, no bloque sólido)
          const threadGrad = ctx.createLinearGradient(0, baseY, 0, MARGIN.bottom);
          threadGrad.addColorStop(0, isKick ? 'rgba(83, 252, 24, 0.40)' : 'rgba(192, 132, 252, 0.45)');
          threadGrad.addColorStop(0.35, isKick ? 'rgba(83, 252, 24, 0.15)' : 'rgba(169, 112, 255, 0.18)');
          threadGrad.addColorStop(0.80, isKick ? 'rgba(83, 252, 24, 0.03)' : 'rgba(169, 112, 255, 0.03)');
          threadGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          // Conexión hilo por hilo: nace en MARGIN.bottom y termina EXACTAMENTE en baseY
          ctx.strokeStyle = threadGrad;
          ctx.lineWidth = threadWidth;
          ctx.beginPath();
          ctx.moveTo(bx, MARGIN.bottom);
          ctx.lineTo(bx, baseY);
          ctx.stroke();
          barsDrawn++;
        }
      }

      // ========================================== 
      // 12. CURVA NEÓN: COLUMNA VERTEBRAL PRINCIPAL (NÍTIDA, DELGADA Y CONTINUA)
      // ========================================== 
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 0.85;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      visiblePoints.forEach((p, idx) => {
        const isLast = (idx === visiblePoints.length - 1);
        const px = isLast ? hX : getX(p.t);
        const py = isLast ? hY : getY(getLiveCurveValue(p.t));
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.restore();

      // Filamento central blanco nítido para máxima definición broadcast
      ctx.save();
      ctx.strokeStyle = isKick ? 'rgba(235, 255, 240, 0.95)' : 'rgba(250, 245, 255, 0.95)';
      ctx.lineWidth = 0.45;
      ctx.beginPath();
      visiblePoints.forEach((p, idx) => {
        const isLast = (idx === visiblePoints.length - 1);
        const px = isLast ? hX : getX(p.t);
        const py = isLast ? hY : getY(getLiveCurveValue(p.t));
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.restore();

      // 13. AGUJA Y CABEZAL LUMINOSO (ÚNICO BADGE OFICIAL EN EL CABEZAL ACTIVO)
      // ========================================== 
      // Guía vertical técnica punteada desde la aguja hasta el eje inferior
      ctx.save();
      ctx.strokeStyle = isKick ? 'rgba(83, 252, 24, 0.40)' : 'rgba(169, 112, 255, 0.40)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(hX, hY);
      ctx.lineTo(hX, MARGIN.bottom);
      ctx.stroke();
      ctx.restore();

      // Halo exterior pulsante neón
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 2;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(hX, hY, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Anillo interior neón
      ctx.fillStyle = neon;
      ctx.beginPath();
      ctx.arc(hX, hY, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Núcleo blanco nítido
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(hX, hY, 2, 0, Math.PI * 2);
      ctx.fill();

      // ÚNICO BADGE FLOTANTE: sobre el cabezal de reproducción activo (a la derecha)
      let badgeText = `${Math.round(hV).toLocaleString('es-ES', {useGrouping:'always'})} VIEWERS`;
      if (currentMode === 'replay') {
        const avg = currentStreamerData?.avg_viewers;
        const hasValidAvg = avg !== null && avg !== undefined && Number.isFinite(Number(avg));
        if (replayProgress >= 1) {
          const peak = currentStreamerData?.peak_viewers;
          const hasPeak = peak !== null && peak !== undefined && Number.isFinite(Number(peak));
          if (hasPeak && hasValidAvg) {
            badgeText = `PICO: ${Math.round(peak).toLocaleString('es-ES', {useGrouping:'always'})} • MEDIA: ${Math.round(avg).toLocaleString('es-ES', {useGrouping:'always'})}`;
          } else {
            badgeText = `MEDIA: ${Math.round(avg || hV).toLocaleString('es-ES', {useGrouping:'always'})} ESPECTADORES`;
          }
        } else if (hasValidAvg) {
          badgeText = `${Math.round(hV).toLocaleString('es-ES', {useGrouping:'always'})} VIEWERS • MEDIA: ${Math.round(avg).toLocaleString('es-ES', {useGrouping:'always'})}`;
        }
      }
      ctx.font = '900 13px Arial';
      const bW = ctx.measureText(badgeText).width + 16;
      const bH = 24;
      const bX = Math.min(W - MARGIN.right - bW, Math.max(MARGIN.left, hX - bW / 2));
      const bY = Math.max(MARGIN.top - 10, hY - 34);

      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = neon;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(bX, bY, bW, bH, 5);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = neon;
      ctx.font = '900 12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, bX + bW / 2, bY + bH / 2);

      let panelValues = null;
      if (reportLayout) panelValues = drawFinalStatistics(currentStreamerData, currentSamples, neon);
      return { design: 'radar-live-equalizer', progress, tracerX: hX, chartRight: W - MARGIN.right,
        timestamp: head.t, viewers: head.v, average: currentStreamerData?.avg_viewers, barsDrawn, panelValues, curveWidth: 0.8 };

    }

        function drawFinalStatistics(d, samples, neon) {
      // Solo presenta los valores del resumen; nunca recalcula ni altera sus estadísticas.
      const valid = v => typeof v === 'number' && Number.isFinite(v);
      const num = (v, digits=0) => valid(v) ? v.toLocaleString('es-ES', {useGrouping:'always',minimumFractionDigits:digits,maximumFractionDigits:digits}) : 'Sin medición';
      const duration = Math.max(0, d.duration_seconds ?? (d.ended_at-d.started_at)/1000);
      const peakSample = samples.reduce((peak,p) => !peak || p.viewers > peak.viewers ? p : peak, null);
      const peakTime = peakSample && peakSample.viewers === d.peak_viewers
        ? new Date(peakSample.timestamp).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : null;
      const ratio = valid(d.avg_viewers) && d.peak_viewers > 0 ? d.avg_viewers / d.peak_viewers * 100 : null;
      const panelValues = {peak:d.peak_viewers,peakTime,hours:d.observed_viewer_hours,ratio,
        messages:d.total_messages,chatters:d.unique_chatters,average:d.avg_viewers};
      const text = (value,x,y,size,color='#f3f7fa',weight=700) => {
        ctx.fillStyle=color; ctx.font=`${weight} ${size}px Arial`; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
        ctx.fillText(value,x,y);
      };
      const box = (y,h) => {
        ctx.fillStyle='#111b24';ctx.fillRect(940,y,305,h);
        ctx.strokeStyle='#263440';ctx.lineWidth=1;ctx.strokeRect(940.5,y+0.5,305,h);
      };
      ctx.save();
      box(120,80);
      text('PICO DE AUDIENCIA OBSERVADO',954,142,10,'#94a3b8');
      text(num(d.peak_viewers),954,171,27);
      text(peakTime ? `${peakTime} • MÁXIMO REGISTRADO` : 'MÁXIMO REGISTRADO',954,189,10,neon);
      box(210,80);
      text('HORAS VISTAS OBSERVADAS',954,232,10,'#94a3b8');
      text(num(d.observed_viewer_hours,1),954,261,27);
      text(`COBERTURA DE AUDIENCIA: ${num(valid(d.coverage_ratio)?d.coverage_ratio*100:null,1)}%`,954,279,10,'#94a3b8');
      box(300,80);
      text('RELACIÓN MEDIA / PICO',954,322,10,'#94a3b8');
      text(valid(ratio)?num(ratio,1)+'%':'Sin medición',954,351,27,'#34d399');
      text(`DURACIÓN: ${Math.floor(duration/3600)}H ${Math.floor(duration%3600/60)}M • NO ES RETENCIÓN`,954,369,10,'#94a3b8');
      box(390,135);
      text('CHATTERS ÚNICOS Y MENSAJES',954,413,10,neon);
      text(num(d.unique_chatters)+' CUENTAS',954,443,23);
      text(num(d.total_messages)+' MENSAJES REGISTRADOS',954,468,11);
      text('Recuentos del chat capturado',954,492,10,'#94a3b8',400);
      text('No permite determinar un porcentaje de bots',954,510,10,'#94a3b8',400);
      ctx.fillStyle='#0e1720';ctx.fillRect(35,540,1210,142);
      ctx.strokeStyle='#263440';ctx.strokeRect(35.5,540.5,1210,142);
      ctx.textAlign='center';ctx.fillStyle=neon;ctx.font='700 12px Arial';
      ctx.fillText('PROMEDIO DE AUDIENCIA OBSERVADA • RESULTADO FINAL',640,568);
      ctx.font='900 54px Arial';ctx.fillStyle='#f3f7fa';
      ctx.fillText(num(d.avg_viewers)+(valid(d.avg_viewers)?' ESPECTADORES':''),640,626);
      ctx.font='10px Arial';ctx.fillStyle='#94a3b8';
      ctx.fillText(`COBERTURA: ${num(valid(d.coverage_ratio)?d.coverage_ratio*100:null,1)}% • CURVA INTERPOLADA ENTRE MUESTRAS • BARRAS DECORATIVAS`,640,659);
      ctx.restore();
      return panelValues;
    }

    // ==========================================
    // CARGA DE DATOS DE LA API EN TIEMPO REAL
    // ==========================================
    async function loadStreamerData(slug, platform) {
      try {
        updateButtonTheme();
        const liveRes = await fetch(`/api/v1/streamers/${slug}/live?platform=${platform}`);
        if (!liveRes.ok) return;
        currentStreamerData = await liveRes.json();

        if (currentStreamerData && currentStreamerData.current_viewers !== undefined) {
          targetViewerCount = currentStreamerData.current_viewers;
          if (displayedViewerCount === 0 && targetViewerCount > 0) {
            displayedViewerCount = targetViewerCount;
          }
          lastSyncTime = Date.now();
        }

        // Cargar foto de avatar real
        if (currentStreamerData.avatar_url && currentStreamerData.avatar_url !== currentAvatarUrl) {
          currentAvatarUrl = currentStreamerData.avatar_url;
          const img = new Image();
          img.onload = () => { streamerAvatarImg = img; };
          img.onerror = () => { console.warn('Avatar image failed to load:', currentAvatarUrl); };
          img.src = currentAvatarUrl;
        }

        // Si está offline o no tiene stream_id activo, recuperar la última emisión registrada
        if (!currentStreamerData.stream_id) {
          try {
            const recRes = await fetch(`/api/v1/streamers/${slug}/recent`);
            if (recRes.ok) {
              const recData = await recRes.json();
              if (Array.isArray(recData.streams) && recData.streams.length > 0) {
                const lastStream = recData.streams[0];
                currentStreamerData.stream_id = lastStream.id;
                currentStreamerData.title = lastStream.title || currentStreamerData.title;
                currentStreamerData.category = lastStream.category || currentStreamerData.category;
                currentStreamerData.started_at = lastStream.started_at ? new Date(lastStream.started_at).getTime() : null;
                currentStreamerData.ended_at = lastStream.ended_at ? new Date(lastStream.ended_at).getTime() : null;
                currentStreamerData.avg_viewers = lastStream.avg_viewers;
                currentStreamerData.peak_viewers = lastStream.peak_viewers;
              }
            }
          } catch (e) {}
        }

        // Cargar historial de muestras (1ra prioridad: historial completo de SQLite, luego RAM)
        let liveSamples = Array.isArray(currentStreamerData.samples) ? currentStreamerData.samples : [];
        if (currentStreamerData.stream_id) {
          const sessRes = await fetch(`/api/v1/streamers/${slug}/session/${currentStreamerData.stream_id}`);
          if (sessRes.ok) {
            const sessData = await sessRes.json();
            if (Array.isArray(sessData.samples) && sessData.samples.length > 0) {
              currentSamples = sessData.samples;
              // Añadir muestras muy recientes en RAM que quizás no estén procesadas en SQLite
              if (liveSamples.length > 0) {
                const lastDbSample = currentSamples[currentSamples.length - 1];
                const freshSamples = liveSamples.filter(s => s.timestamp > lastDbSample.timestamp);
                currentSamples = currentSamples.concat(freshSamples);
              }
            } else if (liveSamples.length > 0) {
              currentSamples = liveSamples;
            }
            
            if (sessData.stream?.avg_viewers !== undefined) {
              currentStreamerData.avg_viewers = sessData.stream.avg_viewers;
            }
          }
        } else if (liveSamples.length > 0) {
          currentSamples = liveSamples;
        }

        if (!currentSamples || currentSamples.length === 0) {
          const now = Date.now();
          const curV = currentStreamerData.current_viewers || 0;
          // Inicializar solo la ventana de conexión actual sin simular horas previas no medidas
          currentSamples = [
            { timestamp: now - 10000, viewers: curV },
            { timestamp: now, viewers: curV }
          ];
        }

        // Si el stream está en directo, sincronizar el último punto con la hora y viewers actuales sin destruir timestamps
        if (currentStreamerData.is_live && currentSamples.length > 0) {
          const now = Date.now();
          const lastSample = currentSamples[currentSamples.length - 1];
          if (now - lastSample.timestamp > 15000) {
            currentSamples.push({ timestamp: now, viewers: targetViewerCount });
          } else {
            lastSample.timestamp = now;
            lastSample.viewers = targetViewerCount;
          }
        }

        // Remuestrear suavemente con PCHIP a puntos densos de alta fidelidad
        const cleaned = cleanSamples(currentSamples);
        const interp = createPchipInterpolator(cleaned);
        currentInterpolator = interp; // Asignación clave para el cálculo exacto de las barras
        const t0 = cleaned[0].t;
        const t1 = cleaned[cleaned.length - 1].t;
        const span = Math.max(1000, t1 - t0);

        densePoints = [];
        const count = Math.max(120, Math.min(800, cleaned.length * 15));
        for (let i = 0; i <= count; i++) {
          const t = t0 + (i / count) * span;
          densePoints.push({ t, v: interp(t) });
        }

        updateStatusText();
      } catch (err) {
        console.error('Error cargando streamer:', err);
      }
    }

    async function loadStreamersList() {
      try {
        const res = await fetch('/api/v1/channels');
        if (!res.ok) return;
        const data = await res.json();
        const select = document.getElementById('streamerSelect');
        if (!select || !Array.isArray(data.channels)) return;

        const sorted = data.channels.sort((a, b) => {
          if (a.is_live && !b.is_live) return -1;
          if (!a.is_live && b.is_live) return 1;
          return (b.viewers || 0) - (a.viewers || 0);
        });

        select.innerHTML = '';
        sorted.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = `${ch.platform}:${ch.slug}`;
          const liveTag = ch.is_live ? `🔴 [LIVE: ${ch.viewers?.toLocaleString() || 0}]` : '⚪ [OFFLINE]';
          opt.textContent = `${liveTag} ${ch.username} (${ch.platform.toUpperCase()})`;
          if (ch.slug.toLowerCase() === currentSlug && ch.platform.toLowerCase() === currentPlatform) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });

        if (!hasCustomParam && sorted.length > 0 && sorted[0].is_live) {
          currentSlug = sorted[0].slug;
          currentPlatform = sorted[0].platform;
          select.value = `${currentPlatform}:${currentSlug}`;
        }
      } catch (e) {}
    }

    function onSelectStreamer(val) {
      if (!val) return;
      const [plat, slug] = val.split(':');
      currentSlug = slug.toLowerCase();
      currentPlatform = plat.toLowerCase();
      displayedViewerCount = 0;
      currentSamples = [];
      densePoints = [];
      if (currentMode === 'replay') {
        setMode('live');
      }
      loadStreamerData(currentSlug, currentPlatform);
    }

    // Exporta el mismo canvas, con reloj determinista y sin consultar la API.
    if (exportMode) window.RadarExport = {
      async prepare({ stream, samples, summary }) {
        currentSlug = stream.slug; currentPlatform = stream.platform;
        currentStreamerData = { ...stream, ...summary, is_live: false };
        currentSamples = samples;
        const cleaned = cleanSamples(samples);
        currentInterpolator = createPchipInterpolator(cleaned);
        const first = cleaned[0].t, last = cleaned.at(-1).t;
        const times = new Set(cleaned.map(p => p.t));
        for (let i = 0; i <= 1120; i++) times.add(first + (last - first) * i / 1120);
        densePoints = [...times].sort((a,b) => a-b).map(t => ({t, v: currentInterpolator(t)}));
        currentMode = 'replay'; showEqualizerBars = true; targetViewerCount = 0;
        const av = stream.avatar_data || stream.avatar_url || stream.avatar;
        if (av) {
          try {
            const img = new Image();
            img.src = av;
            await new Promise(r => { img.onload = r; img.onerror = r; setTimeout(r, 2000); });
            if (img.naturalWidth > 0) streamerAvatarImg = img;
          } catch (e) {}
        }
      },
      drawFrame(frame, fps, seconds) {
        replayProgress = frame / (Math.round(fps * seconds) - 1);
        exportTimeMs = frame * 1000 / fps;
        return draw();
      }
    };
    if (!exportMode) {
    // Inicializar
    loadStreamersList().then(() => {
      loadStreamerData(currentSlug, currentPlatform);
    });

    // Actualizador de latido cada 1 segundo (confirma visualmente que nunca se congela)
    setInterval(() => {
      if (currentMode === 'live') {
        updateStatusText();
      }
    }, 1000);

    // Sondeo de telemetría automática cada 2.5 segundos (sin requerir F5)
    setInterval(() => {
      if (currentMode === 'live') {
        loadStreamerData(currentSlug, currentPlatform);
      }
    }, 2500);

    // Iniciar bucle de dibujo a 60fps
    requestAnimationFrame(draw);
    }
  </script>
