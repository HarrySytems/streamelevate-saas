<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamElevate • Radar Live Graph Test</title>
  <style>
    :root {
      --bg: #070b10;
      --card-bg: #0d131b;
      --accent-neon: #53fc18;
      --twitch-purple: #a970ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .topbar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      color: #f8fafc;
    }
    .brand-icon {
      background: #e11d48;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .select-streamer {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: #334155;
    }
    .btn.active {
      background: var(--accent-neon);
      color: #000000;
      border-color: var(--accent-neon);
      font-weight: 800;
    }
    .btn-twitch.active {
      background: var(--twitch-purple);
      color: #ffffff;
      border-color: var(--twitch-purple);
    }
    .btn-replay {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-replay:hover {
      background: #0369a1;
    }

    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .canvas-card {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #090f15;
      border: 1px solid #1a2634;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status-pill {
      position: absolute;
      bottom: 16px;
      left: 20px;
      background: rgba(13, 19, 27, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>RadarStream • Test de Gráfica Ecualizador</span>
    </div>

    <div class="controls">
      <select id="streamerSelect" class="select-streamer" onchange="onSelectStreamer(this.value)">
        <option value="">Cargando canales...</option>
      </select>

      <button id="btnLiveMode" class="btn active" onclick="setMode('live')">
        🔴 Modo En Vivo (15s)
      </button>

      <button id="btnReplayMode" class="btn btn-replay" onclick="startReplay()">
        ⚡ Simular Reproducción Ecualizador
      </button>

      <button id="btnBarsToggle" class="btn" onclick="toggleEqualizerBars()">
        🎛️ Barras de Espectro: ON
      </button>

      <a href="/live-counter.html" class="btn">
        📊 Ver Modo Contador
      </a>
    </div>
  </header>

  <main class="viewport">
    <div class="canvas-card">
      <canvas id="radarCanvas" width="1280" height="720"></canvas>
      <div class="status-pill">
        <span id="liveDot" class="dot"></span>
        <span id="statusText">Conectando a telemetría en vivo...</span>
      </div>
    </div>
  </main>

  <script>
    let currentSlug = 'westcol';
    let currentPlatform = 'kick';
    let currentStreamerData = null;
    let currentSamples = [];
    let processedPoints = []; // Subsampled points for smooth Bézier drawing

    let streamerAvatarImg = null;
    let currentAvatarUrl = '';

    let currentMode = 'live'; // 'live' | 'replay'
    let showEqualizerBars = true;
    let replayProgress = 1;
    let replayAnimId = null;

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    const MARGIN = {
      left: 100,
      right: 60,
      top: 130,
      bottom: 640
    };

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnLiveMode').classList.toggle('active', mode === 'live');
      document.getElementById('btnReplayMode').classList.toggle('active', mode === 'replay');
      if (mode === 'live') {
        if (replayAnimId) cancelAnimationFrame(replayAnimId);
        replayProgress = 1;
        document.getElementById('liveDot').style.background = currentPlatform === 'kick' ? '#53fc18' : '#a970ff';
        document.getElementById('statusText').textContent = 'Modo En Vivo: Escuchando muestras cada 15s';
      }
    }

    function toggleEqualizerBars() {
      showEqualizerBars = !showEqualizerBars;
      document.getElementById('btnBarsToggle').textContent = `🎛️ Barras de Espectro: ${showEqualizerBars ? 'ON' : 'OFF'}`;
    }

    function startReplay() {
      setMode('replay');
      replayProgress = 0;
      const durationMs = 12000;
      const startTime = performance.now();

      function step(now) {
        if (currentMode !== 'replay') return;
        const elapsed = now - startTime;
        replayProgress = Math.min(1, elapsed / durationMs);
        document.getElementById('statusText').textContent = `Simulando animación ecualizador: ${Math.round(replayProgress * 100)}%`;
        
        if (replayProgress < 1) {
          replayAnimId = requestAnimationFrame(step);
        } else {
          document.getElementById('statusText').textContent = 'Simulación finalizada. Puedes repetir o volver a En Vivo.';
        }
      }
      replayAnimId = requestAnimationFrame(step);
    }

    // ==========================================
    // DIBUJADO DE LA GRÁFICA PURA (ESTILO RADARSTREAM)
    // ==========================================
    function draw() {
      requestAnimationFrame(draw);

      const W = canvas.width;
      const H = canvas.height;
      const isKick = (currentPlatform === 'kick');
      const neon = isKick ? '#53fc18' : '#a970ff';
      const areaColor = isKick ? 'rgba(83, 252, 24, 0.35)' : 'rgba(169, 112, 255, 0.35)';

      // 1. Fondo Broadcast Oscuro
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#090f15');
      bg.addColorStop(1, '#05080c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 2. Líneas de Cuadrícula Sutiles
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 1;
      for (let x = MARGIN.left; x <= W - MARGIN.right; x += 55) {
        ctx.beginPath();
        ctx.moveTo(x, MARGIN.top);
        ctx.lineTo(x, MARGIN.bottom);
        ctx.stroke();
      }

      // 3. Marca de Agua Gigante (KICK o TWITCH)
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.font = '900 160px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentPlatform.toUpperCase(), (MARGIN.left + (W - MARGIN.right)) / 2, (MARGIN.top + MARGIN.bottom) / 2);
      ctx.restore();

      // 4. Barra Neón Superior
      const accent = ctx.createLinearGradient(0, 0, W, 0);
      accent.addColorStop(0, 'transparent');
      accent.addColorStop(0.2, neon);
      accent.addColorStop(0.5, '#ffffff');
      accent.addColorStop(0.8, neon);
      accent.addColorStop(1, 'transparent');
      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, W, 3);

      // 5. Header del Streamer (Arriba)
      const streamerName = (currentStreamerData?.slug || currentSlug).toUpperCase();
      const title = currentStreamerData?.title || 'Emisión en Directo';
      const category = currentStreamerData?.category || 'General';
      const isLive = Boolean(currentStreamerData?.is_live);

      // Avatar con foto real o fallback
      const avX = 65, avY = 60, avR = 30;
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(avX, avY, avR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(avX, avY, avR - 1, 0, Math.PI * 2);
      ctx.clip();
      if (streamerAvatarImg && streamerAvatarImg.complete && streamerAvatarImg.naturalWidth > 0) {
        ctx.drawImage(streamerAvatarImg, avX - avR, avY - avR, avR * 2, avR * 2);
      } else {
        ctx.fillStyle = '#14202c';
        ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
        ctx.fillStyle = neon;
        ctx.font = '900 30px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(streamerName[0] || '?', avX, avY + 2);
      }
      ctx.restore();

      // Badge de Plataforma sobre el avatar
      ctx.save();
      ctx.fillStyle = neon;
      ctx.beginPath();
      ctx.arc(avX + 22, avY + 22, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.font = '900 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isKick ? 'K' : 'T', avX + 22, avY + 23);
      ctx.restore();

      // Textos de Cabecera
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 28px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(streamerName, 115, 52);

      // Badge LIVE
      ctx.fillStyle = isLive ? '#ef4444' : '#475569';
      ctx.beginPath();
      ctx.roundRect(115, 64, isLive ? 68 : 78, 20, 4);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 11px Arial';
      ctx.fillText(isLive ? '🔴 EN VIVO' : 'OFFLINE', 123, 78);

      // Título y Categoría
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 14px Arial';
      let titleDisplay = `TÍTULO: ${title} • [${category}]`;
      if (ctx.measureText(titleDisplay).width > 700) {
        while (titleDisplay.length > 5 && ctx.measureText(titleDisplay).width > 680) {
          titleDisplay = titleDisplay.slice(0, -3);
        }
        titleDisplay += '…';
      }
      ctx.fillText(titleDisplay, 200, 78);

      // Marca RADARSTREAM (Derecha Arriba)
      ctx.fillStyle = neon;
      ctx.font = '900 22px Arial';
      ctx.textAlign = 'right';
      ctx.fillText('RADARSTREAM', W - 60, 52);
      ctx.fillStyle = '#64748b';
      ctx.font = '700 11px Arial';
      ctx.fillText('LIVE TELEMETRY ENGINE • HD VIEW', W - 60, 70);

      // 6. Preparar Escala y Coordenadas de la Gráfica
      if (processedPoints.length < 2) return;

      const firstT = processedPoints[0].t;
      const lastT = processedPoints[processedPoints.length - 1].t;
      const timeSpan = Math.max(1000, lastT - firstT);

      // Pico máximo dinámico
      let maxV = -Infinity;
      processedPoints.forEach(p => { if (p.v > maxV) maxV = p.v; });
      maxV = Math.max(100, maxV);
      const stepRound = maxV > 50000 ? 10000 : (maxV > 20000 ? 5000 : 2000);
      const yCeil = Math.ceil((maxV * 1.12) / stepRound) * stepRound;

      const graphW = (W - MARGIN.right) - MARGIN.left;
      const graphH = MARGIN.bottom - MARGIN.top;

      const getX = (t) => MARGIN.left + ((t - firstT) / timeSpan) * graphW;
      const getY = (v) => MARGIN.bottom - (Math.max(0, v) / yCeil) * graphH;

      // 7. Eje Y con Líneas Guía Horizontales
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = '600 12px Arial';
      ctx.fillStyle = '#64748b';
      const ySteps = 5;
      for (let i = 0; i <= ySteps; i++) {
        const val = Math.round((yCeil / ySteps) * i);
        const yPos = MARGIN.bottom - (i / ySteps) * graphH;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.beginPath();
        ctx.moveTo(MARGIN.left, yPos);
        ctx.lineTo(W - MARGIN.right, yPos);
        ctx.stroke();

        ctx.fillText(val.toLocaleString(), MARGIN.left - 12, yPos);
      }

      // 8. Eje X (Horarios)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const xSteps = 6;
      for (let i = 0; i <= xSteps; i++) {
        const tVal = firstT + (timeSpan / xSteps) * i;
        const xPos = MARGIN.left + (i / xSteps) * graphW;
        const timeStr = new Date(tVal).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        ctx.fillText(timeStr, xPos, MARGIN.bottom + 12);
      }

      // 9. Calcular puntos activos según modo
      const allCoords = processedPoints.map(p => ({
        x: getX(p.t),
        y: getY(p.v),
        v: p.v,
        t: p.t
      }));

      let activeCount = allCoords.length;
      if (currentMode === 'replay') {
        activeCount = Math.max(2, Math.floor(replayProgress * allCoords.length));
      }
      const activeCoords = allCoords.slice(0, activeCount);
      if (activeCoords.length < 2) return;

      const headPt = activeCoords[activeCoords.length - 1];

      // 10. Barras de Espectro Neón (Espaciadas y elegantes)
      if (showEqualizerBars) {
        const numBars = 32;
        const barW = 8;
        const graphSpanX = headPt.x - MARGIN.left;
        const stepX = graphSpanX / numBars;
        const now = performance.now() * 0.003;

        for (let b = 0; b < numBars; b++) {
          const bx = MARGIN.left + b * stepX + (stepX - barW) / 2;
          if (bx + barW > headPt.x) break;

          const norm = b / numBars;
          const ptIdx = Math.min(activeCoords.length - 1, Math.floor(norm * activeCoords.length));
          const curveY = activeCoords[ptIdx]?.y || MARGIN.bottom;
          const maxAvailable = Math.max(0, MARGIN.bottom - curveY);

          const pulse = Math.sin(now + b * 0.45) * 0.35 + 0.65;
          const barH = Math.max(6, Math.min(maxAvailable * 0.55, maxAvailable * 0.3 + pulse * 22));

          const barGrad = ctx.createLinearGradient(0, MARGIN.bottom - barH, 0, MARGIN.bottom);
          barGrad.addColorStop(0, isKick ? 'rgba(83, 252, 24, 0.45)' : 'rgba(169, 112, 255, 0.45)');
          barGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.save();
          ctx.fillStyle = barGrad;
          ctx.beginPath();
          ctx.roundRect(bx, MARGIN.bottom - barH, barW, barH, [4, 4, 0, 0]);
          ctx.fill();
          ctx.restore();
        }
      }

      // 11. Área con Gradiente Suave (Bézier Cuadrática)
      const areaGrad = ctx.createLinearGradient(0, MARGIN.top, 0, MARGIN.bottom);
      areaGrad.addColorStop(0, areaColor);
      areaGrad.addColorStop(0.7, isKick ? 'rgba(83, 252, 24, 0.06)' : 'rgba(169, 112, 255, 0.06)');
      areaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = areaGrad;
      ctx.beginPath();
      ctx.moveTo(activeCoords[0].x, MARGIN.bottom);
      ctx.lineTo(activeCoords[0].x, activeCoords[0].y);
      for (let i = 0; i < activeCoords.length - 1; i++) {
        const p0 = activeCoords[i];
        const p1 = activeCoords[i + 1];
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
      }
      ctx.lineTo(headPt.x, headPt.y);
      ctx.lineTo(headPt.x, MARGIN.bottom);
      ctx.closePath();
      ctx.fill();

      // 12. Línea Neón Resplandeciente (Bézier Cuadrática - Cero Zigzag)
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 3.6;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(activeCoords[0].x, activeCoords[0].y);
      for (let i = 0; i < activeCoords.length - 1; i++) {
        const p0 = activeCoords[i];
        const p1 = activeCoords[i + 1];
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
      }
      ctx.lineTo(headPt.x, headPt.y);
      ctx.stroke();
      ctx.restore();

      // Trazo interior blanco nítido
      ctx.beginPath();
      ctx.moveTo(activeCoords[0].x, activeCoords[0].y);
      for (let i = 0; i < activeCoords.length - 1; i++) {
        const p0 = activeCoords[i];
        const p1 = activeCoords[i + 1];
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
      }
      ctx.lineTo(headPt.x, headPt.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 13. Aguja / Playhead en la Punta
      const hX = headPt.x;
      const hY = headPt.y;

      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 2;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(hX, hY, 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(hX, hY, 4, 0, Math.PI * 2);
      ctx.fill();

      // Badge flotante sobre la aguja
      const badgeText = `${Math.round(headPt.v).toLocaleString()} VIEWERS`;
      ctx.font = '900 13px Arial';
      const bW = ctx.measureText(badgeText).width + 16;
      const bH = 24;
      const bX = Math.min(W - MARGIN.right - bW, Math.max(MARGIN.left, hX - bW / 2));
      const bY = Math.max(MARGIN.top - 10, hY - 34);

      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = neon;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(bX, bY, bW, bH, 5);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = neon;
      ctx.font = '900 12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, bX + bW / 2, bY + bH / 2);
    }

    // ==========================================
    // CARGA Y PROCESAMIENTO DE DATOS
    // ==========================================
    async function loadStreamerData(slug, platform) {
      try {
        const liveRes = await fetch(`/api/v1/streamers/${slug}/live?platform=${platform}`);
        if (!liveRes.ok) return;
        currentStreamerData = await liveRes.json();

        // Cargar foto de avatar real
        if (currentStreamerData.avatar_url && currentStreamerData.avatar_url !== currentAvatarUrl) {
          currentAvatarUrl = currentStreamerData.avatar_url;
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = currentAvatarUrl;
          img.onload = () => { streamerAvatarImg = img; };
        }

        // Cargar muestras históricas de la sesión
        if (currentStreamerData.stream_id) {
          const sessRes = await fetch(`/api/v1/streamers/${slug}/session/${currentStreamerData.stream_id}`);
          if (sessRes.ok) {
            const sessData = await sessRes.json();
            if (Array.isArray(sessData.samples) && sessData.samples.length > 0) {
              currentSamples = sessData.samples;
            }
          }
        }

        if (currentSamples.length === 0) {
          const now = Date.now();
          currentSamples = [
            { timestamp: (currentStreamerData.started_at || now - 60000), viewers: Math.round(currentStreamerData.current_viewers * 0.8) },
            { timestamp: now, viewers: currentStreamerData.current_viewers }
          ];
        }

        // 1. Filtrar puntos adyacentes idénticos (evita escalones/oscilaciones artificiales)
        const deduped = [];
        for (let i = 0; i < currentSamples.length; i++) {
          const cur = { t: Number(currentSamples[i].timestamp ?? currentSamples[i].t), v: Number(currentSamples[i].viewers ?? currentSamples[i].v) };
          const last = deduped[deduped.length - 1];
          if (!last || last.v !== cur.v || (cur.t - last.t > 120000) || i === currentSamples.length - 1) {
            deduped.push(cur);
          }
        }

        // 2. Submuestrear a un número óptimo de puntos para Bézier suave
        const targetCount = Math.min(120, Math.max(20, deduped.length));
        processedPoints = [];
        for (let i = 0; i < targetCount; i++) {
          const idx = Math.min(deduped.length - 1, Math.floor((i / (targetCount - 1)) * (deduped.length - 1)));
          processedPoints.push(deduped[idx]);
        }

        // Asegurar que el último punto tenga exactamente los viewers actuales
        if (processedPoints.length > 0 && currentStreamerData.current_viewers > 0) {
          processedPoints[processedPoints.length - 1].v = currentStreamerData.current_viewers;
          processedPoints[processedPoints.length - 1].t = Date.now();
        }

        if (currentMode === 'live') {
          replayProgress = 1;
          document.getElementById('statusText').textContent = `Muestras activas: ${currentSamples.length} • Viendo: ${slug.toUpperCase()} (${platform.toUpperCase()}) con ${currentStreamerData.current_viewers.toLocaleString()} viewers`;
        }
      } catch (err) {
        console.error('Error cargando streamer:', err);
      }
    }

    async function loadStreamersList() {
      try {
        const res = await fetch('/api/v1/channels');
        if (!res.ok) return;
        const data = await res.json();
        const select = document.getElementById('streamerSelect');
        if (!select || !Array.isArray(data.channels)) return;

        const sorted = data.channels.sort((a, b) => {
          if (a.is_live && !b.is_live) return -1;
          if (!a.is_live && b.is_live) return 1;
          return (b.viewers || 0) - (a.viewers || 0);
        });

        select.innerHTML = '';
        sorted.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = `${ch.platform}:${ch.slug}`;
          const liveTag = ch.is_live ? `🔴 [LIVE: ${ch.viewers?.toLocaleString() || 0}]` : '⚪ [OFFLINE]';
          opt.textContent = `${liveTag} ${ch.username} (${ch.platform.toUpperCase()})`;
          if (ch.slug.toLowerCase() === currentSlug) opt.selected = true;
          select.appendChild(opt);
        });

        if (sorted.length > 0 && sorted[0].is_live) {
          currentSlug = sorted[0].slug;
          currentPlatform = sorted[0].platform;
          select.value = `${currentPlatform}:${currentSlug}`;
        }
      } catch (e) {}
    }

    function onSelectStreamer(val) {
      if (!val) return;
      const [plat, slug] = val.split(':');
      currentSlug = slug.toLowerCase();
      currentPlatform = plat.toLowerCase();
      loadStreamerData(currentSlug, currentPlatform);
    }

    // Inicializar
    loadStreamersList().then(() => {
      loadStreamerData(currentSlug, currentPlatform);
    });

    setInterval(() => {
      if (currentMode === 'live') {
        loadStreamerData(currentSlug, currentPlatform);
      }
    }, 10000);

    requestAnimationFrame(draw);
  </script>
</body>
</html>
