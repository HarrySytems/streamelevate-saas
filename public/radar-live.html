<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamElevate • Radar Live Graph Test</title>
  <style>
    :root {
      --bg: #070b10;
      --card-bg: #0d131b;
      --accent-neon: #53fc18;
      --twitch-purple: #a970ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      color: #f8fafc;
    }
    .brand-icon {
      background: #e11d48;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .select-streamer {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: #334155;
    }
    .btn.active {
      background: var(--accent-neon);
      color: #000000;
      border-color: var(--accent-neon);
      font-weight: 800;
    }
    .btn-twitch.active {
      background: var(--twitch-purple) !important;
      color: #ffffff !important;
      border-color: var(--twitch-purple) !important;
    }
    .btn-replay {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-replay:hover {
      background: #0369a1;
    }
    .btn-replay.active {
      background: #38bdf8 !important;
      color: #000000 !important;
      border-color: #38bdf8 !important;
      font-weight: 800;
    }

    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      min-height: 0;
    }
    .canvas-card {
      width: 100%;
      max-width: 1280px;
      max-height: calc(100vh - 82px);
      aspect-ratio: 16 / 9;
      background: #090f15;
      border: 1px solid #1a2634;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status-pill {
      position: absolute;
      bottom: 12px;
      left: 20px;
      background: rgba(13, 19, 27, 0.92);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(8px);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>RadarStream • Test de Gráfica Ecualizador</span>
    </div>

    <div class="controls">
      <select id="streamerSelect" class="select-streamer" onchange="onSelectStreamer(this.value)">
        <option value="">Cargando canales...</option>
      </select>

      <button id="btnLiveMode" class="btn active" onclick="setMode('live')">
        🔴 Modo En Vivo
      </button>

      <button id="btnReplayMode" class="btn btn-replay" onclick="startReplay()">
        ⚡ Simular Reproducción Ecualizador
      </button>

      <button id="btnBarsToggle" class="btn" onclick="toggleEqualizerBars()">
        🎛️ Barras de Espectro: ON
      </button>

      <a href="/live-counter.html" class="btn">
        📊 Ver Modo Contador
      </a>
    </div>
  </header>

  <main class="viewport">
    <div class="canvas-card">
      <canvas id="radarCanvas" width="1280" height="720"></canvas>
      <div class="status-pill">
        <span id="liveDot" class="dot"></span>
        <span id="statusText">Conectando a telemetría en vivo...</span>
      </div>
    </div>
  </main>

  <script>
    // Parámetros de URL opcionales (ej: ?streamer=kick:brunenger o ?channel=illojuan)
    const urlParams = new URLSearchParams(window.location.search);
    const paramStreamer = urlParams.get('streamer') || urlParams.get('channel');
    let hasCustomParam = false;

    let currentSlug = 'brunenger';
    let currentPlatform = 'kick';

    if (paramStreamer) {
      hasCustomParam = true;
      if (paramStreamer.includes(':')) {
        const [p, s] = paramStreamer.split(':');
        currentPlatform = p.toLowerCase();
        currentSlug = s.toLowerCase();
      } else {
        currentSlug = paramStreamer.toLowerCase();
      }
    }

    let currentStreamerData = null;
    let currentSamples = [];
    let processedPoints = []; // Muestras de la sesión

    let streamerAvatarImg = null;
    let currentAvatarUrl = '';

    let showEqualizerBars = true;
    let currentMode = 'live'; // 'live' | 'replay'
    let replayProgress = 1;
    let replayAnimId = null;

    let targetViewerCount = 0;
    let displayedViewerCount = 0;
    let lastSyncTime = Date.now();

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    // Dimensiones técnicas calibradas (Aprovecha todo el ancho sin cortes)
    const MARGIN = {
      left: 85,
      right: 45,
      top: 100,
      bottom: 630
    };

    function toggleEqualizerBars() {
      showEqualizerBars = !showEqualizerBars;
      document.getElementById('btnBarsToggle').textContent = `🎛️ Barras de Espectro: ${showEqualizerBars ? 'ON' : 'OFF'}`;
    }

    function updateButtonTheme() {
      const isTwitch = (currentPlatform === 'twitch');
      const liveBtn = document.getElementById('btnLiveMode');
      if (liveBtn) {
        liveBtn.classList.toggle('btn-twitch', isTwitch);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnLiveMode').classList.toggle('active', mode === 'live');
      document.getElementById('btnReplayMode').classList.toggle('active', mode === 'replay');
      if (mode === 'live') {
        if (replayAnimId) cancelAnimationFrame(replayAnimId);
        replayProgress = 1;
        const neon = (currentPlatform === 'kick') ? '#53fc18' : '#a970ff';
        document.getElementById('liveDot').style.background = neon;
        document.getElementById('liveDot').style.boxShadow = `0 0 10px ${neon}`;
        updateStatusText();
      }
    }

    function startReplay() {
      setMode('replay');
      replayProgress = 0;
      const durationMs = 12000; // 12 segundos de animación fluida de inicio a presente
      const startTime = performance.now();

      function step(now) {
        if (currentMode !== 'replay') return;
        const elapsed = now - startTime;
        replayProgress = Math.min(1, elapsed / durationMs);

        const pct = Math.round(replayProgress * 100);
        document.getElementById('statusText').textContent = `⚡ Reproduciendo evolución temporal: ${pct}% • Viendo cómo sube y baja la audiencia`;
        document.getElementById('liveDot').style.background = '#38bdf8';
        document.getElementById('liveDot').style.boxShadow = '0 0 10px #38bdf8';

        if (replayProgress < 1) {
          replayAnimId = requestAnimationFrame(step);
        } else {
          document.getElementById('statusText').textContent = `✅ Simulación completada (100%). Haz clic en '🔴 Modo En Vivo' para telemetría en tiempo real.`;
        }
      }

      if (replayAnimId) cancelAnimationFrame(replayAnimId);
      replayAnimId = requestAnimationFrame(step);
    }

    function updateStatusText() {
      if (currentMode === 'replay') return;
      const secSinceSync = Math.max(0, Math.floor((Date.now() - lastSyncTime) / 1000));
      const vCount = Math.round(displayedViewerCount || currentStreamerData?.current_viewers || 0);
      document.getElementById('statusText').textContent = 
        `🟢 TELEMETRÍA EN DIRECTO • ${currentSlug.toUpperCase()} (${currentPlatform.toUpperCase()}) • ${vCount.toLocaleString()} VIEWERS • Sincronizado hace ${secSinceSync}s • ${processedPoints.length} muestras`;
    }

    // ==========================================
    // DIBUJADO DE LA GRÁFICA PURA (ESTILO RADARSTREAM)
    // ==========================================
    function draw() {
      requestAnimationFrame(draw);

      const W = canvas.width;
      const H = canvas.height;
      const isKick = (currentPlatform === 'kick');
      const neon = isKick ? '#53fc18' : '#a970ff';

      // 1. Fondo Broadcast Oscuro
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#090f15');
      bg.addColorStop(1, '#05080c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 2. Marca de Agua Gigante (KICK o TWITCH)
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.font = '900 160px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentPlatform.toUpperCase(), (MARGIN.left + (W - MARGIN.right)) / 2, (MARGIN.top + MARGIN.bottom) / 2);
      ctx.restore();

      // 3. Barra Neón Superior
      const accent = ctx.createLinearGradient(0, 0, W, 0);
      accent.addColorStop(0, 'transparent');
      accent.addColorStop(0.2, neon);
      accent.addColorStop(0.5, '#ffffff');
      accent.addColorStop(0.8, neon);
      accent.addColorStop(1, 'transparent');
      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, W, 3);

      // 4. Header del Streamer (Arriba)
      const streamerName = (currentStreamerData?.slug || currentSlug).toUpperCase();
      const title = currentStreamerData?.title || 'Emisión en Directo';
      const category = currentStreamerData?.category || 'General';
      const isLive = Boolean(currentStreamerData?.is_live);

      // Avatar con foto real o fallback
      const avX = 65, avY = 56, avR = 28;
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(avX, avY, avR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(avX, avY, avR - 1, 0, Math.PI * 2);
      ctx.clip();
      if (streamerAvatarImg && streamerAvatarImg.complete && streamerAvatarImg.naturalWidth > 0) {
        ctx.drawImage(streamerAvatarImg, avX - avR, avY - avR, avR * 2, avR * 2);
      } else {
        ctx.fillStyle = '#14202c';
        ctx.fillRect(avX - avR, avY - avR, avR * 2, avR * 2);
        ctx.fillStyle = neon;
        ctx.font = '900 30px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(streamerName[0] || '?', avX, avY + 2);
      }
      ctx.restore();

      // Badge de Plataforma sobre el avatar
      ctx.save();
      ctx.fillStyle = neon;
      ctx.beginPath();
      ctx.arc(avX + 20, avY + 20, 9.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.font = '900 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isKick ? 'K' : 'T', avX + 20, avY + 21);
      ctx.restore();

      // Textos de Cabecera
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 26px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(streamerName, 110, 48);

      // Badge LIVE
      ctx.fillStyle = isLive ? '#ef4444' : '#475569';
      ctx.beginPath();
      ctx.roundRect(110, 60, isLive ? 68 : 78, 20, 4);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 11px Arial';
      ctx.fillText(isLive ? '🔴 EN VIVO' : 'OFFLINE', 118, 74);

      // Título y Categoría
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 13px Arial';
      let titleDisplay = `TÍTULO: ${title} • [${category}]`;
      if (ctx.measureText(titleDisplay).width > 700) {
        while (titleDisplay.length > 5 && ctx.measureText(titleDisplay).width > 680) {
          titleDisplay = titleDisplay.slice(0, -3);
        }
        titleDisplay += '…';
      }
      ctx.fillText(titleDisplay, 195, 74);

      // Marca RADARSTREAM (Derecha Arriba)
      ctx.fillStyle = neon;
      ctx.font = '900 22px Arial';
      ctx.textAlign = 'right';
      ctx.fillText('RADARSTREAM', W - 60, 48);
      ctx.fillStyle = '#64748b';
      ctx.font = '700 11px Arial';
      ctx.fillText('LIVE TELEMETRY ENGINE • HD VIEW', W - 60, 66);

      // 5. Preparar Escala y Coordenadas de la Gráfica
      if (processedPoints.length < 2) return;

      const firstT = processedPoints[0].t;
      const lastT = processedPoints[processedPoints.length - 1].t;
      const timeSpan = Math.max(1000, lastT - firstT);

      // Pico máximo dinámico calibrado
      let maxV = -Infinity;
      processedPoints.forEach(p => { if (p.v > maxV) maxV = p.v; });
      maxV = Math.max(100, Math.max(maxV, targetViewerCount));
      const stepRound = maxV > 50000 ? 10000 : (maxV > 20000 ? 5000 : (maxV > 5000 ? 1000 : 500));
      const yCeil = Math.ceil((maxV * 1.15) / stepRound) * stepRound;

      const graphW = (W - MARGIN.right) - MARGIN.left;
      const graphH = MARGIN.bottom - MARGIN.top;

      const getX = (t) => MARGIN.left + ((t - firstT) / timeSpan) * graphW;
      const getY = (v) => MARGIN.bottom - (Math.max(0, v) / yCeil) * graphH;

      // ==========================================
      // CUADRÍCULA DE DIBUJANTE TÉCNICO (Mesa de Medición Real)
      // ==========================================
      const squareSize = 45; // Cuadrados de 45px × 45px
      
      // Cuadrícula Menor (Líneas milimétricas tenues)
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = MARGIN.left; x <= W - MARGIN.right; x += squareSize) {
        ctx.beginPath();
        ctx.moveTo(x, MARGIN.top);
        ctx.lineTo(x, MARGIN.bottom);
        ctx.stroke();
      }
      for (let y = MARGIN.bottom; y >= MARGIN.top; y -= squareSize) {
        ctx.beginPath();
        ctx.moveTo(MARGIN.left, y);
        ctx.lineTo(W - MARGIN.right, y);
        ctx.stroke();
      }

      // Cuadrícula Mayor y Escalas de Medición (Cada 2 cuadrados)
      const majorStep = squareSize * 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1.2;
      for (let x = MARGIN.left; x <= W - MARGIN.right; x += majorStep) {
        ctx.beginPath();
        ctx.moveTo(x, MARGIN.top);
        ctx.lineTo(x, MARGIN.bottom);
        ctx.stroke();
      }
      for (let y = MARGIN.bottom; y >= MARGIN.top; y -= majorStep) {
        ctx.beginPath();
        ctx.moveTo(MARGIN.left, y);
        ctx.lineTo(W - MARGIN.right, y);
        ctx.stroke();
      }

      // Marco Técnico de Contorno de la Mesa de Dibujo (Sin cortes de pared)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(MARGIN.left, MARGIN.top, graphW, graphH);

      // Marcas de Cota / Ticks de Dibujante en los Ejes
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1.5;
      for (let x = MARGIN.left; x <= W - MARGIN.right; x += squareSize) {
        ctx.beginPath();
        ctx.moveTo(x, MARGIN.bottom);
        ctx.lineTo(x, MARGIN.bottom + 4);
        ctx.stroke();
      }
      for (let y = MARGIN.bottom; y >= MARGIN.top; y -= squareSize) {
        ctx.beginPath();
        ctx.moveTo(MARGIN.left - 4, y);
        ctx.lineTo(MARGIN.left, y);
        ctx.stroke();
      }
      ctx.restore();

      // ==========================================
      // COTAS Y VALORES DE MEDICIÓN (Eje Y y Eje X)
      // ==========================================
      // 6. Eje Y (Espectadores Reales Calibrados)
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = '600 11px -apple-system, sans-serif';
      ctx.fillStyle = '#94a3b8';
      const yStepCount = Math.min(8, Math.max(4, Math.floor(graphH / (squareSize * 2))));
      for (let i = 0; i <= yStepCount; i++) {
        const val = Math.round((yCeil / yStepCount) * i);
        const yPos = MARGIN.bottom - (i / yStepCount) * graphH;
        ctx.fillText(val.toLocaleString(), MARGIN.left - 8, yPos);
      }

      // 7. Eje X (Tiempos de Medición Reales)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const xStepCount = Math.min(8, Math.max(4, Math.floor(graphW / (squareSize * 3))));
      for (let i = 0; i <= xStepCount; i++) {
        const tVal = firstT + (timeSpan / xStepCount) * i;
        const xPos = MARGIN.left + (i / xStepCount) * graphW;
        const timeStr = new Date(tVal).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        ctx.fillText(timeStr, xPos, MARGIN.bottom + 8);
      }

      // 8. Coordenadas de los Puntos Reales (Sin recortes, 100% de la pantalla)
      const allCoords = processedPoints.map(p => ({
        x: getX(p.t),
        y: getY(p.v),
        v: p.v,
        t: p.t
      }));

      let activeCount = allCoords.length;
      if (currentMode === 'replay') {
        activeCount = Math.max(2, Math.floor(replayProgress * allCoords.length));
      }
      const activeCoords = allCoords.slice(0, activeCount);
      if (activeCoords.length < 2) return;
      const headPt = activeCoords[activeCoords.length - 1];

      // Suavizado e interpolación de espectadores en vivo
      if (currentMode === 'live' && targetViewerCount > 0) {
        displayedViewerCount += (targetViewerCount - displayedViewerCount) * 0.12;
        headPt.v = displayedViewerCount;
        headPt.y = getY(displayedViewerCount);
      }

      // ==========================================
      // 9. ECUALIZADOR REAL DE AUDIENCIA (Barras Tipo Alfiler Conectadas Como Títere)
      // ==========================================
      if (showEqualizerBars) {
        const numBars = 92; // Alta densidad de alfileres finos
        const barW = 2.0;   // Fino como un alfiler
        const stepX = graphW / numBars;
        const now = performance.now() * 0.003;

        let pIdx = 0;
        for (let b = 0; b < numBars; b++) {
          const bx = MARGIN.left + b * stepX + stepX / 2;
          if (bx > headPt.x) break;

          // Altura REAL calculada de la curva en la coordenada X exacta
          while (pIdx < activeCoords.length - 2 && activeCoords[pIdx + 1].x < bx) {
            pIdx++;
          }
          const p0 = activeCoords[pIdx];
          const p1 = activeCoords[pIdx + 1];
          let curveY = MARGIN.bottom;
          if (p0 && p1) {
            const span = (p1.x - p0.x) || 1;
            const ratio = Math.max(0, Math.min(1, (bx - p0.x) / span));
            curveY = p0.y + ratio * (p1.y - p0.y);
          } else {
            curveY = headPt.y;
          }

          // Animación de respiración armónica viva ("Efecto Títere")
          // Las barras oscilan armónicamente conectadas a la curva neón
          const w1 = Math.sin(now * 3.2 + b * 0.35) * 0.045;
          const w2 = Math.cos(now * 1.9 - b * 0.22) * 0.035;
          const puppetPulse = Math.min(1.0, Math.max(0.15, 0.94 + w1 + w2));

          const maxBarH = Math.max(0, MARGIN.bottom - curveY);
          const barH = Math.max(3, maxBarH * puppetPulse);
          if (barH <= 3 && maxBarH <= 3) continue;

          // Gradiente luminoso neón de la aguja
          const barGrad = ctx.createLinearGradient(0, MARGIN.bottom - barH, 0, MARGIN.bottom);
          barGrad.addColorStop(0, isKick ? 'rgba(83, 252, 24, 0.75)' : 'rgba(169, 112, 255, 0.75)');
          barGrad.addColorStop(0.35, isKick ? 'rgba(83, 252, 24, 0.35)' : 'rgba(169, 112, 255, 0.35)');
          barGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.save();
          ctx.fillStyle = barGrad;
          ctx.beginPath();
          ctx.roundRect(bx - barW / 2, MARGIN.bottom - barH, barW, barH, [1, 1, 0, 0]);
          ctx.fill();

          // Puntero de luz en la punta del alfiler (LED Phosphor)
          ctx.fillStyle = isKick ? '#bbf7d0' : '#f3e8ff';
          ctx.fillRect(bx - barW / 2, MARGIN.bottom - barH, barW, 1.8);

          // Hilo conector técnico tipo títere hacia la curva superior
          if (MARGIN.bottom - barH > curveY + 1) {
            ctx.strokeStyle = isKick ? 'rgba(83, 252, 24, 0.30)' : 'rgba(169, 112, 255, 0.30)';
            ctx.lineWidth = 0.8;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(bx, MARGIN.bottom - barH);
            ctx.lineTo(bx, curveY);
            ctx.stroke();

            // Pequeño nódulo de anclaje en la curva
            ctx.fillStyle = neon;
            ctx.beginPath();
            ctx.arc(bx, curveY, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // ==========================================
      // 10. ÁREA DE RELLENO BAJO LA CURVA
      // ==========================================
      const areaGrad = ctx.createLinearGradient(0, MARGIN.top, 0, MARGIN.bottom);
      areaGrad.addColorStop(0, isKick ? 'rgba(83, 252, 24, 0.20)' : 'rgba(169, 112, 255, 0.20)');
      areaGrad.addColorStop(0.65, isKick ? 'rgba(83, 252, 24, 0.04)' : 'rgba(169, 112, 255, 0.04)');
      areaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = areaGrad;
      ctx.beginPath();
      ctx.moveTo(activeCoords[0].x, MARGIN.bottom);
      ctx.lineTo(activeCoords[0].x, activeCoords[0].y);
      for (let i = 0; i < activeCoords.length - 1; i++) {
        const p0 = activeCoords[i];
        const p1 = activeCoords[i + 1];
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
      }
      ctx.lineTo(headPt.x, headPt.y);
      ctx.lineTo(headPt.x, MARGIN.bottom);
      ctx.closePath();
      ctx.fill();

      // ==========================================
      // 11. HILO DELGADITO NEÓN (Máxima Precisión 1-Viewer)
      // ==========================================
      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 1.6; // Hilo fino de precisión
      ctx.shadowColor = neon;
      ctx.shadowBlur = 4; // Resplandor limpio sin manchar
      ctx.beginPath();
      ctx.moveTo(activeCoords[0].x, activeCoords[0].y);
      for (let i = 0; i < activeCoords.length - 1; i++) {
        const p0 = activeCoords[i];
        const p1 = activeCoords[i + 1];
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
      }
      ctx.lineTo(headPt.x, headPt.y);
      ctx.stroke();

      // Núcleo blanco del hilo
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.8;
      ctx.shadowBlur = 0;
      ctx.stroke();
      ctx.restore();

      // ==========================================
      // 12. PLAYHEAD PIN EN LA PUNTA DE LA GRÁFICA
      // ==========================================
      const hX = headPt.x;
      const hY = headPt.y;

      ctx.save();
      ctx.strokeStyle = neon;
      ctx.lineWidth = 2;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(hX, hY, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(hX, hY, 3, 0, Math.PI * 2);
      ctx.fill();

      // Badge Flotante de Viewers Reales
      const badgeText = `${Math.round(headPt.v).toLocaleString()} VIEWERS`;
      ctx.font = '900 12px Arial';
      const bW = ctx.measureText(badgeText).width + 16;
      const bH = 24;
      const bX = Math.min(W - MARGIN.right - bW, Math.max(MARGIN.left, hX - bW / 2));
      const bY = Math.max(MARGIN.top - 10, hY - 32);

      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = neon;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = neon;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(bX, bY, bW, bH, 5);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = neon;
      ctx.font = '900 12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, bX + bW / 2, bY + bH / 2);
    }

    // ==========================================
    // CARGA Y PROCESAMIENTO DE DATOS EN TIEMPO REAL
    // ==========================================
    async function loadStreamerData(slug, platform) {
      try {
        updateButtonTheme();
        const liveRes = await fetch(`/api/v1/streamers/${slug}/live?platform=${platform}`);
        if (!liveRes.ok) return;
        currentStreamerData = await liveRes.json();

        if (currentStreamerData && currentStreamerData.current_viewers !== undefined) {
          targetViewerCount = currentStreamerData.current_viewers;
          if (displayedViewerCount === 0 && targetViewerCount > 0) {
            displayedViewerCount = targetViewerCount;
          }
          lastSyncTime = Date.now();
        }

        // Cargar foto de avatar real
        if (currentStreamerData.avatar_url && currentStreamerData.avatar_url !== currentAvatarUrl) {
          currentAvatarUrl = currentStreamerData.avatar_url;
          const img = new Image();
          img.onload = () => { streamerAvatarImg = img; };
          img.onerror = () => { console.warn('Avatar image failed to load:', currentAvatarUrl); };
          img.src = currentAvatarUrl;
        }

        // Cargar muestras históricas de la sesión
        if (currentStreamerData.stream_id) {
          const sessRes = await fetch(`/api/v1/streamers/${slug}/session/${currentStreamerData.stream_id}`);
          if (sessRes.ok) {
            const sessData = await sessRes.json();
            if (Array.isArray(sessData.samples) && sessData.samples.length > 0) {
              currentSamples = sessData.samples;
            }
          }
        }

        if (!currentSamples || currentSamples.length === 0) {
          const now = Date.now();
          const curV = currentStreamerData.current_viewers || 0;
          currentSamples = [
            { timestamp: now - 30000, viewers: Math.max(0, curV - 10) },
            { timestamp: now - 15000, viewers: Math.max(0, curV - 4) },
            { timestamp: now, viewers: curV }
          ];
        }

        // 1. Conservar TODAS las muestras reales registradas (fidelidad 1-viewer)
        const deduped = [];
        for (let i = 0; i < currentSamples.length; i++) {
          const cur = { 
            t: Number(currentSamples[i].timestamp ?? currentSamples[i].t), 
            v: Number(currentSamples[i].viewers ?? currentSamples[i].v) 
          };
          const last = deduped[deduped.length - 1];
          if (!last || last.t !== cur.t) {
            deduped.push(cur);
          }
        }

        processedPoints = deduped;

        // Asegurar que el último punto tenga exactamente los viewers actuales y la hora actual
        if (processedPoints.length > 0) {
          const lastPt = processedPoints[processedPoints.length - 1];
          const now = Date.now();
          if (now - lastPt.t > 15000) {
            processedPoints.push({ t: now, v: currentStreamerData.current_viewers });
          } else {
            lastPt.v = currentStreamerData.current_viewers;
            lastPt.t = now;
          }
        }

        updateStatusText();
      } catch (err) {
        console.error('Error cargando streamer:', err);
      }
    }

    async function loadStreamersList() {
      try {
        const res = await fetch('/api/v1/channels');
        if (!res.ok) return;
        const data = await res.json();
        const select = document.getElementById('streamerSelect');
        if (!select || !Array.isArray(data.channels)) return;

        const sorted = data.channels.sort((a, b) => {
          if (a.is_live && !b.is_live) return -1;
          if (!a.is_live && b.is_live) return 1;
          return (b.viewers || 0) - (a.viewers || 0);
        });

        select.innerHTML = '';
        sorted.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = `${ch.platform}:${ch.slug}`;
          const liveTag = ch.is_live ? `🔴 [LIVE: ${ch.viewers?.toLocaleString() || 0}]` : '⚪ [OFFLINE]';
          opt.textContent = `${liveTag} ${ch.username} (${ch.platform.toUpperCase()})`;
          if (ch.slug.toLowerCase() === currentSlug && ch.platform.toLowerCase() === currentPlatform) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });

        if (!hasCustomParam && sorted.length > 0 && sorted[0].is_live) {
          currentSlug = sorted[0].slug;
          currentPlatform = sorted[0].platform;
          select.value = `${currentPlatform}:${currentSlug}`;
        }
      } catch (e) {}
    }

    function onSelectStreamer(val) {
      if (!val) return;
      const [plat, slug] = val.split(':');
      currentSlug = slug.toLowerCase();
      currentPlatform = plat.toLowerCase();
      displayedViewerCount = 0;
      currentSamples = [];
      processedPoints = [];
      if (currentMode === 'replay') {
        setMode('live');
      }
      loadStreamerData(currentSlug, currentPlatform);
    }

    // Inicializar
    loadStreamersList().then(() => {
      loadStreamerData(currentSlug, currentPlatform);
    });

    // Actualizador de latido cada 1 segundo (confirma visualmente que nunca se congela)
    setInterval(() => {
      if (currentMode === 'live') {
        updateStatusText();
      }
    }, 1000);

    // Polling de telemetría automática cada 3 segundos (sin requerir F5)
    setInterval(() => {
      if (currentMode === 'live') {
        loadStreamerData(currentSlug, currentPlatform);
      }
    }, 3000);

    requestAnimationFrame(draw);
  </script>
