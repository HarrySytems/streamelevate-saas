<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay Pro | StreamElevate</title>
    <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            background: transparent; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            height: 95vh; 
            transition: background 0.5s; 
        }

        #chat-container { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
        }

        .msg { 
            will-change: transform, opacity; 
            background: rgba(10, 10, 10, 0.9); 
            padding: 12px 18px; 
            margin-top: 8px; 
            border-left: 5px solid #53fc18; 
            border-radius: 4px; 
            font-size: 20px; 
            font-weight: 500; 
            text-shadow: 2px 2px 4px black; 
            animation: slideIn 0.12s forwards;
            max-width: 90%; 
            word-wrap: break-word; 
            overflow-wrap: break-word; 
            word-break: break-word; 
            white-space: pre-wrap; 
            box-sizing: border-box;
        }
        
        .msg.alert { 
            border-left-color: #ffaa00; 
            background: rgba(30, 20, 0, 0.95); 
            font-size: 28px; 
            font-weight: 900; 
            text-transform: uppercase; 
            border-radius: 6px; 
        }

        .msg.manual { 
            border: 2px solid #00e5ff; 
            border-left: 8px solid #00e5ff; 
            background: linear-gradient(90deg, rgba(0, 30, 50, 0.95), rgba(0, 10, 20, 0.95)); 
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4); 
            padding: 18px 24px; 
            font-size: 26px; 
            border-radius: 8px; 
        } 
        
        .user { 
            font-weight: 900; 
            margin-right: 10px; 
            text-transform: uppercase; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9); 
        }

        .user.alert-user { color: #ffaa00 !important; font-size: 32px; }
        .user.manual-user { text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); }
        
        .chat-emote { height: 32px; vertical-align: middle; margin: 0 3px;}

        #test-mode-badge { 
            display: none; 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: #00e5ff; 
            color: black; 
            font-size: 10px; 
            font-weight: bold; 
            padding: 4px 8px; 
            border-radius: 4px; 
            text-transform: uppercase; 
        }

        @keyframes slideIn { 
            from { opacity: 0; transform: translateX(-15px); } 
            to { opacity: 1; transform: translateX(0); } 
        }

        @keyframes fadeOut { 
            to { opacity: 0; transform: translateY(-5px); } 
        }
    </style>
</head>
<body>
    <div id="test-mode-badge">Modo Navegador (Fondo de Prueba)</div>
    <div id="chat-container"></div>
    
    <script>
        const isOBS = navigator.userAgent.toLowerCase().includes("obs");
        if (!isOBS) { 
            document.body.style.background = "#0a0a0a"; 
            document.getElementById('test-mode-badge').style.display = "block"; 
        }

        const socket = io(); 
        let currentMode = 'auto';
        let duration = 15000;

        const urlParams = new URLSearchParams(window.location.search);
        const chatroomId = urlParams.get('id');

        if (chatroomId) {
            socket.emit('joinStreamRoom', chatroomId);
            
            const pusher = new Pusher('32cbd69e4b950bf97679', { cluster: 'us2', forceTLS: true });
            const channel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);
            
            channel.bind('App\\Events\\ChatMessageEvent', (data) => {
                if (currentMode === 'auto') {
                    const d = typeof data === 'string' ? JSON.parse(data) : data;
                    const sender = d.sender;
                    
                    let color = '#53fc18'; 
                    
                    if (sender.identity && sender.identity.color) {
                        color = sender.identity.color;
                    }
                    
                    renderHTML(sender.username, d.content, 'normal', color);
                }
            });
        }

        socket.on('applyConfig', (d) => {
            if (d.type === 'mode') { 
                currentMode = d.value; 
                document.getElementById('chat-container').innerHTML = ''; 
            }
            if (d.type === 'duration') {
                duration = d.value;
            }
        });

        socket.on('clearOverlay', () => {
            document.getElementById('chat-container').innerHTML = '';
        });
        
        socket.on('renderCustomMessage', (data) => { 
            document.getElementById('chat-container').innerHTML = ''; 
            renderHTML(data.user, data.msg, data.type, data.color); 
        });
        
        socket.on('renderSpecificMessage', (d) => { 
            document.getElementById('chat-container').innerHTML = ''; 
            renderHTML(d.user, d.text, 'manual', d.color); 
        });

        // RENDERIZADOR GRAFICO (SIN BADGES, SOLO COLOR)
        function renderHTML(user, text, type, userColor = '#53fc18') {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div'); 
            div.className = 'msg ' + type;
            
            const uClass = 'user ' + (type === 'alert' ? 'alert-user' : (type === 'manual' ? 'manual-user' : ''));
            const styleAttribute = (type !== 'alert') ? `style="color: ${userColor};"` : '';
            
            const html = text.replace(/\[emote:(\d+):([^\]]+)\]/g, '<img src="https://files.kick.com/emotes/$1/fullsize" class="chat-emote">');
            
            div.innerHTML = `<span class="${uClass}" ${styleAttribute}>${user}:</span> ${html}`;
            container.appendChild(div);
            
            if (currentMode === 'auto' && container.children.length > 15) {
                container.firstChild.remove();
            }
            
            setTimeout(() => { 
                if (div.parentNode) { 
                    div.style.animation = "fadeOut 0.2s forwards"; 
                    setTimeout(() => div.remove(), 200); 
                } 
            }, duration);
        }
    </script>
</body>
</html>
